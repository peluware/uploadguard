# Integration test rig for UploadGuard.
#
#   test/run-tests.sh          brings everything up, runs the suite, prints a summary
#   docker compose -f test/docker-compose.yml down -v    tears it down
#
# storage      a real S3-compatible backend, single node, throwaway data
# uploadguard  the proxy, the real shaded jar run with the same command as the systemd unit
# tools        boto3, used only to presign URLs and to read back what was stored
#
# URLs are presigned for http://uploadguard:8080 and curl runs inside the network, so the Host
# header matches the signature and nothing depends on the host's port forwarding. Port 8080 is
# still published so you can fire a presigned URL by hand from your machine.
name: uploadguard-test

services:
  storage:
    image: dxflrs/garage:v2.1.0
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - storage-meta:/var/lib/garage/meta
      - storage-data:/var/lib/garage/data
    ports:
      - "13900:3900"   # only for debugging from the host
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 40

  uploadguard:
    image: eclipse-temurin:25-jre
    volumes:
      - ../target:/app:ro
    environment:
      UPSTREAM_URL: http://storage:3900
      PORT: "8080"
    command: ["java", "-Djdk.httpclient.allowRestrictedHeaders=host", "-Xmx256m", "-jar", "/app/uploadguard.jar"]
    ports:
      - "8080:8080"
    depends_on:
      storage:
        condition: service_healthy

  edge:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"   # only for poking at it by hand
    depends_on:
      uploadguard:
        condition: service_started
      storage:
        condition: service_healthy

  tools:
    build:
      context: .
      dockerfile: Dockerfile.tools
    volumes:
      - .:/work
    working_dir: /work
    environment:
      AWS_DEFAULT_REGION: garage
      STORAGE_ENDPOINT: http://storage:3900
      SIGNED_ENDPOINT: http://uploadguard:8080
      BUCKET: uploads
    command: sleep infinity
    depends_on:
      storage:
        condition: service_healthy

volumes:
  storage-meta:
  storage-data:
