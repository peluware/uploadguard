# The reverse proxy in front, for the test rig. Mirrors deploy/bunkerweb/*.conf as closely as a
# standalone nginx can, so what the suite proves here is what that config does in production.
#
# One public host. Routing by method: PUT goes through the validating proxy, everything else goes
# straight to the storage backend.

worker_processes 1;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # nginx collapses "//" into "/" while parsing, before anything is forwarded. A key containing
    # "//" would reach the backend mangled and its signature would no longer match.
    merge_slashes off;

    upstream storage_backend { server storage:3900;     keepalive 16; }
    upstream guard_backend   { server uploadguard:8080; keepalive 16; }

    # nginx cannot match a location by method, so the decision is a variable. Every method that can
    # carry a body goes through the validating proxy; the rest never touches the JVM.
    map $request_method $route {
        default  storage_backend;
        PUT      guard_backend;
        POST     guard_backend;
        PATCH    guard_backend;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 0;
        client_body_timeout 60s;

        location / {
            # Variable, and no path after it: nginx then passes the request URI exactly as the client
            # sent it. A path or a trailing slash here would hand over a normalized, decoded URI.
            proxy_pass http://$route;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # $host and not $http_host: with HTTP/2 the client sends :authority and no Host header,
            # so $http_host is empty, and nginx drops a header whose value is empty. The backend then
            # gets no Host at all. This rig speaks HTTP/1.1, so it would not catch that on its own.
            proxy_set_header Host $host;

            proxy_request_buffering off;
            proxy_buffering off;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
